name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Firma estable (para poder actualizar la app sin desinstalar)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Usando keystore fija"
          else
            echo "::warning::Sin DEBUG_KEYSTORE_B64: cada compilación tendrá otra firma"
          fi

      - name: Dependencias y sincronización
        run: |
          npm ci
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          npx cap sync android

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Claudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Claudio-apk
          path: Claudio.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Claudio.apk \
            --target "${{ github.sha }}" \
            --title "Claudio — última versión" \
            --notes "APK compilada automáticamente desde ${GITHUB_SHA::7}. Descargala desde el teléfono e instalala." \
            --latest
