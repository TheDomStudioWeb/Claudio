name: Compilar APK

on:
  push:
    branches: [main, modo-reunion, archivos-claudio, camara-claudio]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dependencias y sincronización
        run: |
          npm ci
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          npx cap sync android

      - name: Modelo de voz en español (Vosk)
        id: vosk
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/vosk-es
          key: vosk-model-small-es-0.42

      - name: Descargar modelo si no está en caché
        if: steps.vosk.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/model.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          unzip -q /tmp/model.zip -d /tmp/model
          mkdir -p android/app/src/main/assets
          mv /tmp/model/vosk-model-small-es-0.42 android/app/src/main/assets/vosk-es
          du -sh android/app/src/main/assets/vosk-es

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Claudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Claudio-apk
          path: Claudio.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            gh release delete apk --yes --cleanup-tag || true
            gh release create apk Claudio.apk \
              --target "${{ github.sha }}" \
              --title "Claudio — última versión" \
              --notes "APK compilada automáticamente desde ${GITHUB_SHA::7}. Descargala desde el teléfono e instalala." \
              --latest
          else
            gh release delete apk-prueba --yes --cleanup-tag || true
            gh release create apk-prueba Claudio.apk \
              --target "${{ github.sha }}" \
              --title "Claudio — versión de prueba (${GITHUB_REF_NAME})" \
              --notes "APK de prueba compilada desde la rama ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). La versión estable sigue en 'Claudio — última versión'." \
              --prerelease
          fi
